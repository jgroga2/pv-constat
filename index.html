<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PWA - TCMP Gendarmerie</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a2a3a">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --primary: #1a2a3a;
      --accent: #003366;
      --border: #ccd0d5;
      --text: #212529;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); margin: 0; padding: 12px; }
    header { text-align: center; margin-bottom: 16px; }
    h1 { font-size: 1.1rem; color: var(--accent); margin: 0; text-transform: uppercase; }
    .card { background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border); padding: 14px; margin-bottom: 12px; }
    h2 { font-size: 0.9rem; margin-top: 0; margin-bottom: 10px; color: var(--primary); text-transform: uppercase; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .full-width { grid-column: span 2; }
    label { font-size: 0.75rem; font-weight: bold; display: block; margin-bottom: 3px; }
    input, select, textarea { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 0.85rem; }
    textarea { resize: vertical; min-height: 60px; }
    .btn-group { display: flex; gap: 8px; margin-top: 14px; }
    button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 0.9rem; font-weight: bold; cursor: pointer; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-danger { background: #b02a37; color: #fff; }
    .voice-btn { background: #e9ecef; border: 1px solid #ced4da; padding: 4px 8px; font-size: 0.75rem; border-radius: 4px; float: right; margin-top: -2px; }
    .voice-btn.active { background: #dc3545; color: white; }
    .photo-preview { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .photo-preview img { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border); }
  </style>
</head>
<body>

  <header>
    <h1>P.V. de Constatations et Mesures Prises</h1>
  </header>

  <form id="tcmpForm">
    <!-- Unité & Dossier -->
    <div class="card">
      <h2>1. Références Procédurales</h2>
      <div class="grid">
        <div class="full-width">
          <label>Hiérarchie / Unité</label>
          <input type="text" id="unite" value="GROUPEMENT D'INDRE-ET-LOIRE - COMPAGNIE D'AMBOISE - BTA VOUVRAY">
        </div>
        <div>
          <label>Code Unité</label>
          <input type="text" id="codeUnite" value="03710">
        </div>
        <div>
          <label>Nmr P.V.</label>
          <input type="text" id="numPv" value="00125">
        </div>
        <div>
          <label>Année</label>
          <input type="text" id="annee" value="2026">
        </div>
        <div>
          <label>N° Dossier Justice</label>
          <input type="text" id="dossierJustice" value="26/00458">
        </div>
      </div>
    </div>

    <!-- Cadre Légal & Enquêteur -->
    <div class="card">
      <h2>2. Enquêteur & Cadre Légal</h2>
      <div class="grid">
        <div>
          <label>Cadre d'enquête</label>
          <select id="cadre">
            <option value="PRELIMINAIRE">Enquête Préliminaire (Art. 75-78 CPP)</option>
            <option value="FLAGRANCE">Crime ou Délit Flagrant (Art. 53-67 CPP)</option>
          </select>
        </div>
        <div>
          <label>Qualité de l'enquêteur</label>
          <select id="qualiteOpj">
            <option value="OPJ">OPJ territorialement compétent</option>
          </select>
        </div>
        <div>
          <label>Grade & Identité</label>
          <input type="text" id="nomOpj" value="Adjudant Jean GROGA">
        </div>
        <div>
          <label>Résidence administrative</label>
          <input type="text" id="residence" value="VOUVRAY 37210">
        </div>
      </div>
    </div>

    <!-- Rubriques Opérationnelles -->
    <div class="card">
      <h2>
        3. Constatations
        <button type="button" class="voice-btn" onclick="toggleVoice('constatations')">🎤 Vocal</button>
      </h2>
      <textarea id="constatations" placeholder="État des lieux, infractions constatées..."></textarea>
      <input type="file" id="photosConstatations" accept="image/*" multiple onchange="handlePhotos(this, 'previewConstatations')">
      <div id="previewConstatations" class="photo-preview"></div>
    </div>

    <div class="card">
      <h2>
        4. Mesures Diverses
        <button type="button" class="voice-btn" onclick="toggleVoice('mesures')">🎤 Vocal</button>
      </h2>
      <textarea id="mesures">Nous invitons la victime à venir déposer plainte à notre unité munie d'un état estimatif et descriptif précis des objets dérobés. Le rendez-vous est fixé à la brigade de Vouvray dans un délai de 5 jours.</textarea>
    </div>

    <!-- Clôture -->
    <div class="card">
      <h2>5. Clôture des Opérations</h2>
      <div class="grid">
        <div>
          <label>Date et heure fin</label>
          <input type="text" id="dateFin" value="vendredi 11 septembre 2026 à 23 heures 20 minutes">
        </div>
        <div>
          <label>Date de clôture</label>
          <input type="text" id="dateClos" value="vendredi 11 septembre 2026">
        </div>
      </div>
    </div>

    <div class="btn-group">
      <button type="button" class="btn-danger" onclick="resetForm()">🔄 Tout effacer</button>
      <button type="button" class="btn-primary" onclick="generatePDF()">📄 Générer PDF</button>
    </div>
  </form>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
